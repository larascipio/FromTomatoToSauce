<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FromTomatoToSauce</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      background: #fdf6ee;
      color: #3d2b1f;
    }
    header {
      background: #b4452c;
      color: #fff;
      padding: 18px 24px;
      font-size: 22px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    header .sub { font-weight: 400; font-size: 13px; opacity: 0.85; }
    main { max-width: 860px; margin: 24px auto; padding: 0 16px; }
    .card {
      background: #fff;
      border: 1px solid #e8dccb;
      border-radius: 10px;
      padding: 18px;
      margin-bottom: 18px;
    }
    .card h2 { margin: 0 0 8px; font-size: 18px; }
    textarea, input {
      width: 100%;
      border: 1px solid #d8c6ae;
      border-radius: 8px;
      padding: 10px;
      font-size: 14px;
      font-family: inherit;
      background: #fffdf8;
    }
    textarea { min-height: 130px; resize: vertical; }
    .row { display: flex; gap: 10px; margin-top: 10px; align-items: center; }
    .row input { flex: 1; }
    button {
      background: #b4452c;
      color: #fff;
      border: 0;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 14px;
      cursor: pointer;
      white-space: nowrap;
    }
    button:hover { background: #96391f; }
    button:disabled { opacity: 0.6; cursor: default; }
    .error { color: #b00020; margin-top: 8px; }
    .fine { font-size: 13px; color: #7a6a56; margin-top: 8px; }
    #search { margin-top: 4px; }
    .controls { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; }
    .tag {
      display: inline-block;
      background: #f2e5d3;
      border-radius: 999px;
      padding: 2px 10px;
      font-size: 12px;
      margin: 0 4px 4px 0;
    }
    .recipe-meta { font-size: 12px; color: #7a6a56; }
    .recipe-details { margin-top: 12px; border-top: 1px dashed #e8dccb; padding-top: 10px; }
    .recipe-details h4 { margin: 10px 0 4px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.4px; color: #7a6a56; }
    ul { margin: 0 0 6px; padding-left: 20px; }
    li { margin-bottom: 3px; }
    .recipe-card { cursor: pointer; }
    .empty { color: #7a6a56; text-align: center; padding: 30px 0; }
    .preview { border: 1px solid #c8e6c9; background: #f1f8f1; }
  </style>
</head>
<body>
  <header>
    FromTomatoToSauce
    <span class="sub">your personal cookbook</span>
  </header>
  <main>
    <section class="card">
      <h2>Add a recipe</h2>
      <p class="fine">Paste a recipe from Instagram (or anywhere). The app will extract the title, ingredients, steps and tags automatically.</p>
      <textarea id="recipeText" placeholder="Paste recipe text here..."></textarea>
      <div class="row">
        <input id="recipeSource" type="text" placeholder="Source (e.g. @some.account) — optional" />
        <button id="saveBtn">Save recipe</button>
      </div>
      <div id="saveError" class="error"></div>
      <div id="saveOk" class="fine"></div>
    </section>

    <section class="card preview" id="preview" style="display:none">
      <h2>Parsed &amp; saved</h2>
      <div id="previewBody"></div>
    </section>

    <section class="card">
      <h2>My recipes</h2>
      <div class="controls">
        <input id="search" type="text" placeholder="Search by ingredient, e.g. 'tomato garlic'" />
        <button id="searchBtn">Search</button>
      </div>
      <div id="recipes"></div>
    </section>
  </main>

  <script>
    const $ = id => document.getElementById(id);

    async function saveRecipe() {
      const text = $("recipeText").value.trim();
      const source = $("recipeSource").value.trim();
      if (!text) { $("saveError").textContent = "Paste some recipe text first."; return; }
      $("saveError").textContent = "";
      $("saveOk").textContent = "";
      $("saveBtn").disabled = true;
      $("saveBtn").textContent = "Parsing with Mistral...";
      try {
        const res = await fetch("/recipes", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text, source: source || null }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Something went wrong.");
        $("recipeText").value = "";
        $("recipeSource").value = "";
        $("saveOk").textContent = "Saved " + data.recipe.title + " (\#" + data.recipe.id + ")";
        showPreview(data.recipe);
        loadRecipes();
      } catch (err) {
        $("saveError").textContent = err.message;
      } finally {
        $("saveBtn").disabled = false;
        $("saveBtn").textContent = "Save recipe";
      }
    }

    function showPreview(r) {
      $("preview").style.display = "block";
      let html = "<div class=\"recipe-meta\">tags: " +
        (r.tags.map(t => "<span class=\"tag\">" + escapeHtml(t) + "</span>").join(" ") || "none") +
        "</div>";
      html += "<h4>Ingredients</h4><ul>" + r.ingredients.map(i => "<li>" + escapeHtml(i) + "</li>").join("") + "</ul>";
      html += "<h4>Steps</h4><ul>" + r.steps.map(s => "<li>" + escapeHtml(s) + "</li>").join("") + "</ul>";
      $("previewBody").innerHTML = html;
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function loadRecipes() {
      const q = $("search").value.trim();
      const url = q ? "/recipes/search?q=" + encodeURIComponent(q) : "/recipes";
      fetch(url).then(res => res.json()).then(recipes => {
        const box = $("recipes");
        if (!recipes.length) {
          box.innerHTML = "<div class=\"empty\">No recipes yet. Paste one above!</div>";
          return;
        }
        box.innerHTML = recipes.map(r => {
          let html = "<div class=\"card recipe-card\" onclick=\"this.classList.toggle('expanded')\">";
          html += "<strong>" + escapeHtml(r.title) + "</strong><br/>";
          html += "<div class=\"recipe-meta\">" + r.ingredients.length + " ingredients · " +
                  r.steps.length + " steps" + (r.source ? " · " + escapeHtml(r.source) : "") + "</div>";
          html += "<div class=\"recipe-details\" style=\"display:none\">";
          html += "<div>" + r.tags.map(t => "<span class=\"tag\">" + escapeHtml(t) + "</span>").join(" ") + "</div>";
          html += "<h4>Ingredients</h4><ul>" + r.ingredients.map(i => "<li>" + escapeHtml(i) + "</li>").join("") + "</ul>";
          html += "<h4>Steps</h4><ol>" + r.steps.map(s => "<li>" + escapeHtml(s) + "</li>").join("") + "</ol>";
          html += "</div></div>";
          return html;
        }).join("");
        document.querySelectorAll(".recipe-card").forEach(card =>
          card.addEventListener("click", () => {
            const details = card.querySelector(".recipe-details");
            details.style.display = details.style.display === "none" ? "block" : "none";
          })
        );
      });
    }

    $("saveBtn").addEventListener("click", saveRecipe);
    $("searchBtn").addEventListener("click", loadRecipes);
    $("search").addEventListener("keydown", e => { if (e.key === "Enter") loadRecipes(); });

    loadRecipes();
  </script>
</body>
</html>
